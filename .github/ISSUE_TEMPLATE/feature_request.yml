name: 功能建议
description: 提出新功能或改进（请先说明要解决的场景，而不是只要一个开关）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 描述场景与当前的不便；「我想要一个 X 按钮」通常不足以判断该不该做
      placeholder: 写长文档时，我想在不离开键盘的情况下跳到下一个标题……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 交互形态、快捷键、是否要设置项；有原型或截图更好
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 现有绕过方式
      description: 你试过哪些替代？为什么不够用？
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 你估计影响面
      description: 项目按分层约束改造，影响面决定了实施成本
      options:
        - 不确定
        - 表现层（视图 / 快捷键 / 主题）
        - 应用层或领域层（文档模型、导出、偏好设置）
        - 基础设施层（文件读写、图片、字体、PDF）
        - 构建 / 发布 / 文档
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
