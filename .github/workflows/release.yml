name: Release

# S9-04 / S9-06：打 tag → 三平台构建打包 → 聚合校验和 → 创建 Release。
#
# 触发：`git tag v1.0.0 && git push origin v1.0.0`（tag 必须以 v 开头，
# 版本号遵循语义化版本；tag 名与 Cargo.toml 的 version 不一致会 fail——
# 防止「tag 打错版本」产出一批命名错误的产物）。
#
# 签名与公证（S9-05）：默认**不签名**。macOS 侧若 secrets 配置了
# MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD / MACOS_CERT_IDENTITY，则导入证书并
# 做 Developer ID 签名；若再配置 MACOS_NOTARY_APPLE_ID /
# MACOS_NOTARY_APPLE_PASSWORD / MACOS_NOTARY_TEAM_ID，则对 .app 与 .dmg
# 执行 notarytool 公证 + stapler 装订，并在签名后 spctl 校验。
# Windows 暂无签名步骤（SmartScreen 提示必须在 Release Notes 说明）。
# 私钥严禁入仓：只经 secrets 注入，`.gitignore` 已排除证书文件。
#
# 与 ci.yml 同源的三条约定：① 工具链由 `rust-toolchain.toml` 决定（runner
# 预装的 rustup 读取），不在 workflow 里重复版本号；② 最小权限（构建只读，
# 发布 job 才声明 write）；③ 每步一条可复制到本地执行的命令。

on:
  push:
    tags:
      - "v*"

# 最小权限：打包只读代码；写权限只在 release job 单独声明。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ubuntu-20.04 已被 GitHub 下线（runner 镜像退役），改用 22.04。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1
            artifact_glob: dist/rustmark-v*-windows-*.zip
          - os: macos-latest
            script: bash scripts/package-macos.sh
            artifact_glob: "dist/rustmark-v*-macos*"
          - os: ubuntu-22.04
            script: bash scripts/package-linux.sh
            artifact_glob: "dist/rustmark-v*-linux-x64*"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一真源 = 仓库根 `rust-toolchain.toml`（channel / components / profile）。
      #
      # 不用 `dtolnay/rust-toolchain`：它的 `toolchain` 是 **required** 输入，而 Actions
      # runner 不在解析期强制该约束——workflow 能解析、CI 能排队，只有运行到这一步才报
      # "'toolchain' is a required input" 并 exit 1。改用 runner 预装的 rustup：
      # 它读仓库根 `rust-toolchain.toml`，版本号不重复。
      - name: Install Rust
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # macOS 正式签名/公证的前置：把 p12 证书导入临时钥匙串。
      # 未配置 MACOS_CERTIFICATE 时整步跳过，打包仍走 ad-hoc 签名。
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "未配置 MACOS_CERTIFICATE，跳过证书导入（打包将使用 ad-hoc 签名）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/rustmark-signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          CERT="$RUNNER_TEMP/rustmark-cert.p12"
          # base64 编码的 secrets 在 macOS/Linux 上解码参数不一致，统一用 python3。
          printf '%s' "$MACOS_CERTIFICATE" |
            python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$CERT"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
          # 临时钥匙串追加到搜索列表（保留原有条目，供证书链校验）。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          echo "签名证书已导入临时钥匙串"

      # tag 版本与 Cargo.toml 一致性守卫：防「tag 打错版本」整批产物报废。
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::未能从 Cargo.toml 解析出 version（守卫无法判定）"
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$TAG 与 Cargo.toml version $CARGO_VERSION 不一致"
            exit 1
          fi
          echo "版本守卫通过：v$TAG"

      - name: Build & package
        shell: bash
        run: ${{ matrix.script }}
        env:
          # macOS 正式签名（可选）：secret 配置了才生效，否则脚本走 ad-hoc。
          CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          # macOS 公证（可选）：三个 secret 同时存在才启用；缺一即打包失败。
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

      # 签名与公证在 package-macos.sh 内完成；此步骤在其后独立复核：
      # bundle 完整、字体布局正确、公证票根已装订且 Gatekeeper 放行。
      # 未配置公证凭据时不跑 spctl/stapler——ad-hoc 或未公证的证书签名
      # 同样会被 Gatekeeper 拒绝，作为门禁只会造成假红。
      - name: Verify macOS signature, layout & notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Rustmark.app
          if [ ! -d dist/Rustmark.app/Contents/Resources/fonts ]; then
            echo "::error::内置字体必须在 Contents/Resources/fonts"
            exit 1
          fi
          if [ -e dist/Rustmark.app/Contents/MacOS/fonts ]; then
            echo "::error::字体不得位于 Contents/MacOS/fonts（codesign 会当成代码）"
            exit 1
          fi
          if [ -n "${NOTARY_APPLE_ID:-}" ]; then
            xcrun stapler validate dist/Rustmark.app
            xcrun stapler validate dist/rustmark-v*-macos.dmg
            spctl --assess --type execute --verbose=2 dist/Rustmark.app
            echo "公证、装订与 Gatekeeper 校验通过"
          else
            echo "未配置公证凭据：跳过 stapler/spctl 校验（签名未公证）"
          fi
          echo "macOS bundle 签名与字体布局校验通过"

      # 产物清单进 Job Summary：哪一档缺了直接看到，不必逐个点开 Artifacts。
      - name: Inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${{ matrix.artifact_glob }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未找到产物：${{ matrix.artifact_glob }}"
            exit 1
          fi
          {
            echo "### 产物（${{ matrix.os }}）"
            echo ""
            for f in "${files[@]}"; do
              echo "- \`$f\` — $(wc -c < "$f") 字节"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/rustmark-v*
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-all -type f \( -name 'rustmark-v*' -o -name '*.sha256' \) -exec mv {} dist/ \;
          # 汇总校验和：一行一文件，用户可 `sha256sum -c SHA256SUMS`。
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
          rm -f dist/*.sha256
          cat dist/SHA256SUMS

      # S9-06：Release Notes 按 commit message 的 [S{阶段}-{编号}] 自动归组。
      # 「生成」与「上传」分离：脚本产 markdown，gh 创建 release。
      # 逻辑落在 tools/gen_release_notes.py（而非内联 heredoc），便于离线演练：
      # `python tools/release_dryrun.py` 会用构造的 subject 列表验证归组正确性。
      - name: Generate release notes (grouped by phase tag)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gen_release_notes.py --tag "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      # DEP-06：SBOM（CycloneDX 1.5）随产物发布。`cargo metadata --locked`
      # 需要本机有 cargo，故这一步先装工具链（本 job 之前不需要 Rust）。
      # 生成器零第三方依赖，判据（结构 / 确定性）由 tools/release_dryrun.py 守着。
      # 工具链由仓库根 `rust-toolchain.toml` 驱动（唯一真源），见 build job 的同名注释。
      - name: Install Rust (for cargo metadata)
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Generate SBOM (CycloneDX 1.5)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sbom.py --output dist/sbom.cdx.json
          python3 - <<'PY'
          import json
          bom = json.load(open("dist/sbom.cdx.json", encoding="utf-8"))
          assert bom["bomFormat"] == "CycloneDX", bom.get("bomFormat")
          assert bom["specVersion"] == "1.5", bom.get("specVersion")
          print(f"SBOM: {len(bom['components'])} components")
          PY

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "rustmark ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/rustmark-v* dist/SHA256SUMS dist/sbom.cdx.json
        env:
          GH_TOKEN: ${{ github.token }}
