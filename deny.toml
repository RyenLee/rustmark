# cargo-deny 配置（阶段 01：S1-08）
# 运行：cargo deny check licenses advisories bans sources
# 注意：需先 `cargo install cargo-deny --locked`（本机 0.20.2 验证通过）

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# 本项目以 MIT / Apache-2.0 双许可发布（需求 §2.3），传递依赖须与之兼容
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # egui 0.37 起 epaint_default_fonts 内嵌字体数据的许可证（SIL/Ubuntu 字体，
    # 仅随二进制分发字体数据，均允许嵌入再分发）
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # ureq → webpki-roots 内置根证书数据（CDLA Permissive 2.0，数据类许可）
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
