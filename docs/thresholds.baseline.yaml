        anchor: "SUPPRESS_MS: u64 = 100"
        purpose: "滚动同步回声抑制窗口；短于帧间隔覆盖不住回声，长于 150ms 会让用户觉得前 0.1 秒没反应。"
        recommended: "80-150"
        configurable: "硬编码 const"
