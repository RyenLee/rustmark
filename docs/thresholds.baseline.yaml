# rustmark 阈值基线（只读参考，运行时不加载）
# 生成日期：2026-10-25（整改后复核）；扫描基线提交：574b946 + c08fd13
# 与 docs/threshold-audit-2026-10-25.md 同源生成；source 字段精确到行，value 与源码逐字一致。
schema: rustmark.thresholds/v1
runtime_consumed: false
scan_base_commit: 574b946+c08fd13
state: post-remediation
audit_report: docs/threshold-audit-2026-10-25.md
review_report: docs/threshold-review-2026-10-25.md
checker: tools/check_thresholds.py
scope:
  included:
    - src/
    - crates/*/src/
    - build.rs
    - Cargo.toml
    - rust-toolchain.toml
    - .rustfmt.toml
    - deny.toml
    - .github/workflows/ci.yml
    - .github/workflows/release.yml
    - scripts/*
    - tools/coverage_gate.py
    - tests/ (仅性能与覆盖率门禁断言)
  excluded:
    - 纯几何排版常量（窗口/对话框宽高、padding、圆角、图标尺寸）
    - tests/ 内部数据构造与 fixture 参数
    - Cargo.lock 依赖版本
  absent_by_design:
    - .env / .env.example
    - Dockerfile / 部署清单
    - 重试 / 退避 / 并发度 / 限流 / 分页参数
modules:
  build_ci:
    title: 构建工具链与 CI 门禁
    thresholds:
      toolchain_channel:
        value: "1.99.0"
        unit: "toolchain version"
        source: "rust-toolchain.toml:4"
        anchor: "channel = \"1.99.0\""
        purpose: "全仓 Rust 工具链唯一真源，CI 不再另写版本号。文件缺失或版本低于此值即编译失败；升级需改这一处。"
        recommended: "1.99.0（随 MSRV 单点升级）"
        configurable: "配置文件 rust-toolchain.toml"
      rust_msrv:
        value: 1.99
        unit: "Rust version"
        source: "Cargo.toml:80"
        anchor: "rust-version = \"1.99\""
        purpose: "包级最低 Rust 版本声明，cargo 解析依赖时据此拒绝过低版本。与 toolchain_channel 须同步。"
        recommended: "1.99（与工具链同步）"
        configurable: "配置文件 Cargo.toml"
      rustfmt_max_width:
        value: 100
        unit: "columns"
        source: ".rustfmt.toml:2"
        anchor: "max_width = 100"
        purpose: "格式化行宽硬上限，cargo fmt --check 的第一步门禁。超宽即 fmt 失败、CI 红。"
        recommended: "100"
        configurable: "配置文件 .rustfmt.toml"
      deny_confidence_threshold:
        value: 0.93
        unit: "ratio"
        source: "deny.toml:27"
        anchor: "confidence-threshold = 0.93"
        purpose: "许可证文本识别的置信度下限。低于阈值的依赖无法自动判定许可，需手写 [[licenses.clarify]]，否则 licenses 检查失败。"
        recommended: "0.90-0.95"
        configurable: "配置文件 deny.toml"
      artifact_size_limit_ci:
        value: 11534336
        unit: "bytes"
        source: ".github/workflows/ci.yml:60"
        anchor: "SIZE_LIMIT_BYTES"
        purpose: "CI 体积红线（11 MiB），由 size_gate.sh 读取；越线 exit 1 使 check job 失败。按基线 10,487,296 B 尚有约 1.0 MiB 余量。"
        recommended: "11534336（须与 NFR-PERF-01 单一真源一致）"
        configurable: "环境变量 SIZE_LIMIT_BYTES（CI env）"
      artifact_size_warn_ci:
        value: 11010048
        unit: "bytes"
        source: ".github/workflows/ci.yml:61"
        anchor: "SIZE_WARN_BYTES"
        purpose: "CI 体积预警线（10.5 MiB），越线只输出 ::warning 不失败；保留约 512 KiB 可行动窗口，当前产物不触发。"
        recommended: "11010048（10.5 MiB，保留约 512 KiB 可行动窗口）"
        configurable: "环境变量 SIZE_WARN_BYTES（CI env）"
      artifact_size_limit_local:
        value: 11534336
        unit: "bytes"
        source: "scripts/size_gate.sh:25"
        anchor: "LIMIT=\"${SIZE_LIMIT_BYTES:-11534336}\""
        purpose: "本地与 CI 共用的体积红线默认值（11 MiB）；CI 经环境变量覆盖，故实际生效值取决于 CI。越线 exit 1。"
        recommended: "11534336"
        configurable: "环境变量 SIZE_LIMIT_BYTES（默认值）"
      artifact_size_warn_local:
        value: 11010048
        unit: "bytes"
        source: "scripts/size_gate.sh:26"
        anchor: "WARN=\"${SIZE_WARN_BYTES:-11010048}\""
        purpose: "体积预警线默认值（10.5 MiB）；越线仅告警并打印距红线余量。"
        recommended: "11010048（10.5 MiB）"
        configurable: "环境变量 SIZE_WARN_BYTES（默认值）"
      package_size_limit_linux:
        value: 11534336
        unit: "bytes"
        source: "scripts/package-linux.sh:114"
        anchor: "packageLimitBytes=11534336"
        purpose: "Linux 打包后 tar.gz / AppImage 单产物红线（安装包口径，11 MiB）；越线 status=1 使打包失败。"
        recommended: "11534336（与 CI 同源）"
        configurable: "硬编码字面量（脚本内）"
      package_size_limit_macos:
        value: 11534336
        unit: "bytes"
        source: "scripts/package-macos.sh:109"
        anchor: "packageLimitBytes=11534336"
        purpose: "macOS .app.zip / .dmg 单产物红线（安装包口径，11 MiB）；越线 exit 1。"
        recommended: "11534336（与 CI 同源）"
        configurable: "硬编码字面量（脚本内）"
      package_size_limit_windows:
        value: 11534336
        unit: "bytes"
        source: "scripts/package-windows.ps1:73"
        anchor: "$packageLimitBytes = 11534336"
        purpose: "Windows zip 产物红线（安装包口径，11 MiB）；越线 throw 终止打包。"
        recommended: "11534336（与 CI 同源）"
        configurable: "硬编码字面量（脚本内）"
      ci_timeout_check:
        value: 45
        unit: "minutes"
        source: ".github/workflows/ci.yml:76"
        anchor: "timeout-minutes: 45"
        purpose: "check job（三平台编译 + 全量测试）超时上限；超时即取消并判定失败。"
        recommended: "30-60"
        configurable: "配置文件 ci.yml"
      ci_timeout_perf:
        value: 30
        unit: "minutes"
        source: ".github/workflows/ci.yml:229"
        anchor: "timeout-minutes: 30"
        purpose: "perf job（release 性能冒烟）超时上限；超时即失败。"
        recommended: "40（整帧 smoke）；NFR 另测服务层 ≤10ms"
        configurable: "配置文件 ci.yml"
      ci_timeout_coverage:
        value: 30
        unit: "minutes"
        source: ".github/workflows/ci.yml:265"
        anchor: "timeout-minutes: 30"
        purpose: "coverage job（llvm-cov 全量插桩）超时上限；超时即无 lcov.info，门禁失败。"
        recommended: "30-45"
        configurable: "配置文件 ci.yml"
      ci_timeout_release_dryrun:
        value: 10
        unit: "minutes"
        source: ".github/workflows/ci.yml:319"
        anchor: "timeout-minutes: 10"
        purpose: "release-dryrun job 超时上限；离线演练为纯 Python，超时即流程异常。"
        recommended: "5-15"
        configurable: "配置文件 ci.yml"
      ci_timeout_deny:
        value: 20
        unit: "minutes"
        source: ".github/workflows/ci.yml:339"
        anchor: "timeout-minutes: 20"
        purpose: "deny job（依赖许可 / 安全公告）超时上限；超时即门禁未判定。"
        recommended: "10-20"
        configurable: "配置文件 ci.yml"
      ci_timeout_release_build:
        value: 45
        unit: "minutes"
        source: ".github/workflows/release.yml:48"
        anchor: "timeout-minutes: 45"
        purpose: "release 打包矩阵单平台超时上限；超时即该平台产物缺失。"
        recommended: "30-60"
        configurable: "配置文件 release.yml"
      ci_timeout_release_publish:
        value: 15
        unit: "minutes"
        source: ".github/workflows/release.yml:112"
        anchor: "timeout-minutes: 15"
        purpose: "release 汇总与 gh release create 的超时上限；超时即 tag 已推但 Release 未生成。"
        recommended: "10-20"
        configurable: "配置文件 release.yml"
      coverage_overall_min:
        value: 70
        unit: "percent"
        source: "tools/coverage_gate.py:88"
        anchor: "default=70.0"
        purpose: "整体行覆盖门限；低于「门限-2 个百分点」即 ::error 并 exit 1。"
        recommended: "70-80"
        configurable: "命令行参数 --overall（默认值）"
      coverage_domain_min:
        value: 90
        unit: "percent"
        source: "tools/coverage_gate.py:89"
        anchor: "default=90.0"
        purpose: "领域层（src/domain/**）行覆盖门限；低于 门限-2 即失败。"
        recommended: "90-95"
        configurable: "命令行参数 --domain（默认值）"
      coverage_buffer:
        value: 2
        unit: "percent"
        source: "tools/coverage_gate.py:105"
        anchor: "args.overall - 2.0"
        purpose: "覆盖率门限缓冲区：落在 [门限-2, 门限) 只告警，低于门限-2 才失败。"
        recommended: "1-3"
        configurable: "硬编码字面量（脚本内）"
  perf_gates:
    title: 性能门禁（release 测试断言）
    thresholds:
      perf_1mb_parse_p50:
        value: 2000
        unit: "ms"
        source: "tests/integration/large_file_test.rs:159"
        anchor: "p50 <= 2000.0"
        purpose: "1MB 文档解析 p50 上限（仅 release 生效）；超线测试失败，perf job 红。"
        recommended: "1000-2500"
        configurable: "硬编码字面量（测试断言）"
      perf_1mb_first_screen_p50:
        value: 500
        unit: "ms"
        source: "tests/integration/large_file_test.rs:177"
        anchor: "p50 <= 500.0"
        purpose: "1MB 文档首屏渲染 p50 上限（降级路径，仅 release）；超线判退化。"
        recommended: "300-800"
        configurable: "硬编码字面量（测试断言）"
      perf_1mb_scroll_map_p50:
        value: 200
        unit: "ms"
        source: "tests/integration/large_file_test.rs:196"
        anchor: "p50 <= 200.0"
        purpose: "1MB 文档滚动映射 p50 上限（仅 release）；超线说明映射退化为 O(全文)。"
        recommended: "100-300"
        configurable: "硬编码字面量（测试断言）"
      perf_1mb_find_p50:
        value: 1500
        unit: "ms"
        source: "tests/integration/large_file_test.rs:234"
        anchor: "p50 <= 1500.0"
        purpose: "1MB 全文查找（忽略大小写）p50 上限（仅 release）；超线即命中扫描退化。"
        recommended: "500-2000"
        configurable: "硬编码字面量（测试断言）"
      perf_1mb_find_case_sensitive_p50:
        value: 1500
        unit: "ms"
        source: "tests/integration/large_file_test.rs:260"
        anchor: "p50 <= 1500.0"
        purpose: "1MB 全文查找（大小写敏感）p50 上限（仅 release）。"
        recommended: "500-2000"
        configurable: "硬编码字面量（测试断言）"
      perf_100k_lines_parse:
        value: 5000
        unit: "ms"
        source: "tests/integration/large_file_test.rs:413"
        anchor: "elapsed <= 5000.0"
        purpose: "10 万行文本解析上限；该断言无 release 限定，debug 下同样生效。"
        recommended: "3000-8000"
        configurable: "硬编码字面量（测试断言）"
      perf_long_url_parse:
        value: 3000
        unit: "ms"
        source: "tests/integration/large_file_test.rs:458"
        anchor: "elapsed <= 3000.0"
        purpose: "10 万字符超长 URL 解析上限（防灾难性回溯）；debug 下同样生效。"
        recommended: "1000-3000"
        configurable: "硬编码字面量（测试断言）"
      perf_10kb_parse_p95:
        value: 50
        unit: "ms"
        source: "tests/integration/main.rs:492"
        anchor: "p95 <= 50.0"
        purpose: "10KB 文档解析 p95 上限（目标 5ms 的 10 倍宽限）；超线判数量级退化。"
        recommended: "50（smoke）；另加 NFR 断言 ≤10ms"
        configurable: "硬编码字面量（测试断言）"
      perf_nfr_10kb_parse_p95:
        value: 10
        unit: "ms"
        source: "tests/integration/main.rs:501"
        anchor: "NFR-PERF-06：10KB 解析 p95"
        purpose: "NFR 合规断言（仅 release）：10KB 解析 p95 ≤10ms（指标 5ms + 2× 容差），与 50ms 的 smoke 门禁并存。"
        recommended: "10"
        configurable: "硬编码字面量（测试断言）"
      perf_syntax_set_load:
        value: 30
        unit: "ms"
        source: "tests/integration/main.rs:546"
        anchor: "load.as_millis() <= 30"
        purpose: "syntect 语法集加载耗时上限；超线影响首屏高亮可用时间。"
        recommended: "50（smoke）；另加 NFR 断言 ≤10ms"
        configurable: "硬编码字面量（测试断言）"
      perf_highlight_per_lang_warm:
        value: 1000
        unit: "µs"
        source: "tests/integration/main.rs:607"
        anchor: "warm_per_lang <= 1000"
        purpose: "20 种语言热路径单语言高亮耗时上限（约 1ms）；超线逼近一帧预算。"
        recommended: "500-2000"
        configurable: "硬编码字面量（测试断言）"
      perf_10kb_incremental_frame_p95:
        value: 40
        unit: "ms"
        source: "tests/presentation/highlight_perf_test.rs:212"
        anchor: "frame_p95 <= 40.0"
        purpose: "10KB 文档改一行后的增量帧 p95 上限（目标 10ms 的 4 倍宽限）。"
        recommended: "40（整帧 smoke）；NFR 另测服务层 ≤10ms"
        configurable: "硬编码字面量（测试断言）"
      perf_nfr_10kb_highlight_settle:
        value: 10
        unit: "ms"
        source: "tests/integration/main.rs:761"
        anchor: "NFR-PERF-05：10KB 停手补算"
        purpose: "NFR 合规断言（仅 release）：10KB 停手后一次性全文高亮 ≤10ms，正对 NFR-PERF-05 的口径。"
        recommended: "10"
        configurable: "硬编码字面量（测试断言）"
      perf_1mb_degraded_frame_p95:
        value: 16
        unit: "ms"
        source: "tests/presentation/highlight_perf_test.rs:258"
        anchor: "p95 <= 16.0"
        purpose: "1MB 降级路径稳态滚动帧 p95 上限（60fps 单帧预算）；超线即掉帧。"
        recommended: "16-33"
        configurable: "硬编码字面量（测试断言）"
      perf_long_line_p95_release:
        value: 500
        unit: "ms"
        source: "tests/presentation/highlight_perf_test.rs:332"
        anchor: "500.0"
        purpose: "超长单行（27 万字节）改一字符的 p95 上限（release）；超线判定需行级截断保护。"
        recommended: "300-800"
        configurable: "硬编码字面量（测试断言）"
      perf_long_line_p95_debug:
        value: 1500
        unit: "ms"
        source: "tests/presentation/highlight_perf_test.rs:330"
        anchor: "1500.0"
        purpose: "同一用例的 debug 阈值（release 的 3 倍）；只用于钉住“不卡死”，达标结论以 release 为准。"
        recommended: "1000-2000"
        configurable: "硬编码字面量（测试断言）"
      perf_idle_frame_limit:
        value: "8 / 24"
        unit: "ms"
        source: "tests/presentation/textedit_frame_perf_test.rs:247"
        anchor: "24.0 } else { 8.0"
        purpose: "编辑区空闲帧 p50 上限：文档 <1MiB 取 8ms，≥1MiB 取 24ms（release）；超线说明 O(全文) 工作回到每帧路径。"
        recommended: "8（小文档）/ 24（1MB）"
        configurable: "硬编码字面量（测试断言）"
      perf_typing_frame_limit:
        value: "16 / 64"
        unit: "ms"
        source: "tests/presentation/textedit_frame_perf_test.rs:204"
        anchor: "64.0 } else { 16.0"
        purpose: "编辑区击键帧 p95 上限：<1MiB 取 16ms，≥1MiB 取 64ms（release）；超线说明高亮防抖失效。"
        recommended: "16（小文档）/ 64（1MB）"
        configurable: "硬编码字面量（测试断言）"
      perf_debug_multiplier:
        value: 8
        unit: "ratio"
        source: "tests/presentation/textedit_frame_perf_test.rs:249"
        anchor: "release * 8.0"
        purpose: "debug 构建下空闲帧/击键帧阈值的统一放大倍数（debug 排版约慢一个数量级）。"
        recommended: "6-10"
        configurable: "硬编码字面量（测试断言）"
      perf_search_tab_switch:
        value: 100
        unit: "ms"
        source: "tests/presentation/search_perf_test.rs:225"
        anchor: "switch_ms < 100.0"
        purpose: "切到搜索标签首帧上限（1MB 文档 + 50 命中，仅 release）；超线即 UI 卡顿。"
        recommended: "100（一帧交互预算）"
        configurable: "硬编码字面量（测试断言）"
      perf_current_doc_search:
        value: 10
        unit: "ms"
        source: "tests/presentation/search_perf_test.rs:327"
        anchor: "current_p50 < 10.0"
        purpose: "「当前文档」范围单次搜索上限（1000 文件工作区）；超线说明又按工作区全量读盘。该断言 debug 也生效。"
        recommended: "5-10"
        configurable: "硬编码字面量（测试断言）"
  document_workspace:
    title: 文档与工作区
    thresholds:
      preferences_schema_version:
        value: 1
        unit: "version"
        source: "crates/rustmark-core/src/domain/preferences/aggregate.rs:12"
        anchor: "PREFERENCES_SCHEMA_VERSION: u32 = 1"
        purpose: "偏好配置 schema 版本；版本不匹配时配置按迁移/回退处理，避免旧字段静默生效。"
        recommended: "1（破坏性变更时 +1）"
        configurable: "硬编码 const"
      autosave_interval_default:
        value: 30
        unit: "seconds"
        source: "crates/rustmark-core/src/domain/preferences/value_objects/editor.rs:258"
        anchor: "auto_save_interval: Some(30)"
        purpose: "自动保存默认间隔；None 关闭自动保存，0 被 is_valid 拒绝。间隔过短会频繁落盘，过长丢失窗口变大。"
        recommended: "10-60"
        configurable: "配置文件 settings.toml（editor.auto_save_interval）+ 硬编码默认值"
      undo_merge_window_ms:
        value: 400
        unit: "ms"
        source: "crates/rustmark-core/src/domain/document/undo.rs:44"
        anchor: "merge_window_ms: 400"
        purpose: "撤销合并窗口：窗口内连续同类编辑合并为一个撤销点。过短则撤销粒度碎，过长则一次撤销吃掉整段输入。"
        recommended: "300-800"
        configurable: "配置文件 settings.toml（editor.undo_merge_window_ms）+ 硬编码默认值"
      undo_max_depth:
        value: 200
        unit: "snapshots"
        source: "crates/rustmark-core/src/domain/document/undo.rs:45"
        anchor: "max_depth: 200"
        purpose: "每文档撤销栈最大深度；超出丢弃最旧快照。过大徒增内存，过小历史不够用。"
        recommended: "200（须配合 64 MiB 字节上限）"
        configurable: "硬编码 const（UndoPolicy::default_policy）"
      undo_max_bytes:
        value: 67108864
        unit: "bytes"
        source: "crates/rustmark-core/src/domain/document/undo.rs:46"
        anchor: "max_bytes: DEFAULT_MAX_BYTES"
        via: "crates/rustmark-core/src/domain/document/undo.rs"
        purpose: "undo + redo 两份栈的合计字节预算（64 MiB）；快照是全文副本，只按条数限制会让 1MB 文档最坏占到 200 MiB。超限先丢 redo 远端，再丢 undo 最旧项。"
        recommended: "67108864"
        configurable: "硬编码 const（UndoPolicy::default_policy）＋ with_max_bytes 可覆盖"
      max_open_documents_default:
        value: 12
        unit: "documents"
        source: "crates/rustmark-core/src/domain/preferences/value_objects/editor.rs:151"
        anchor: "MAX_OPEN_DOCUMENTS_DEFAULT: u32 = 12"
        purpose: "同时打开文档数默认上限；达到上限后打开新文件需先关闭。低于 12 会碍事，高于 30 标签条已无法辨认。"
        recommended: "8-16"
        configurable: "配置文件 settings.toml（editor.max_open_documents）+ 硬编码默认值"
      max_open_documents_max:
        value: 30
        unit: "documents"
