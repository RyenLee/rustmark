[package]
# 独立 crate 版本号不随应用发版（publish = false，仅参与本地 workspace 构建）。
name = "rustmark-ports"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "rustmark 的架构端口（契约）：dialog / event / system / image_asset / time（R-10 项 A 从 shared 抽出）"
publish = false

[dependencies]
# 端口内部复用 shared 的纯值类型（error / path / text_format / geometry /
# ids / result 等）：ports 单向依赖 shared，不得反向（否则成环）。
rustmark-shared = { path = "../rustmark-shared" }

# 纯数据结构所需（与 shared 同规格）：
# - serde：端口里带数据载荷的枚举 / 结构（Timestamp / DomainEvent / FileFilter）派生；
# - thiserror：端口错误派生；
# - ahash：与 shared 保持一致的 no-rng 哈希器（部分端口结构参与缓存键）。
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ahash = { version = "0.8", default-features = false, features = ["std", "no-rng"] }

# V11-65：lint 经 [workspace.lints] 单点继承。
[lints]
workspace = true
