[package]
name = "rustmark-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rustmark 的基础设施层：外部库适配与 IO 实现（端口在 core）"
publish.workspace = true

[dependencies]
# --- 本地 crate（端口与领域类型在 core，实现在此）---
rustmark-core = { path = "../rustmark-core" }

# --- 本地 crate（R-10 项 A：架构端口契约，2026-10-28 从 shared 抽出）---
# infra 直接依赖本 crate 取端口契约（dialog / event / system / image_asset /
# time），不再经 `rustmark_core::shared::<port>` 间接取——端口已迁至
# `rustmark-ports`，core 只负责把 crate 拼回 `rustmark_core::ports::…`。
rustmark-ports = { path = "../rustmark-ports" }

# --- 解析与高亮（ADR-002）---
# 与 core 时期同规格声明；V11-65 起版本继承 root [workspace.dependencies]。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { workspace = true }

# --- 图片解码（S6-05 预览区显示图片；落盘与缩放在 persistence）---
image = { workspace = true }

# --- 文本缓冲（rope_text_buffer）---
ropey = "1.6.1"

# --- 对话框（dialogs/rfd_adapter）---
rfd = "0.17.2"

# --- 配置与序列化（preferences / recent_files 落盘）---
# V11-67：serde / thiserror 的版本与 feature 继承 root [workspace.dependencies]；
# toml 仅本 crate 使用（单一声明点即真源），留在使用处。
serde = { workspace = true }
toml = "1.1.8"

# --- 错误处理（asset_loader 的限额错误等）---
thiserror = { workspace = true }

# --- 远程图片下载（缺陷 025：https 图片此前因「未内置 TLS」全部失败）---
# 纯 Rust TLS（rustls + ring）；REL-03 体积缓解：不启 rustls-webpki-roots，
# 根证书运行期从平台信任库读取（见 asset_loader.rs 的 platform_root_certs）。
#
# 体积（建议 2）：整条 TLS 链（ureq + rustls + ring + webpki）约 0.7–1.2 MiB。
# 改为 optional，由 `remote-images` feature 门控：**本 crate 不设 default**，
# 由二进制组合根（root）的 `default = ["remote-images"]` 转发开启。这样
# distro / 内网分发可 `cargo build --release --no-default-features` 整条剔除，
# 代价仅是 `![](https://…)` 不再加载；本地 / 相对 / data URI 图片不受影响。
ureq = { version = "3.5.0", default-features = false, optional = true, features = [
    "rustls-no-provider",
    "_ring",
] }
rustls-native-certs = { version = "0.8", optional = true }

# --- 日志（越界告警用）---
log = { workspace = true }

[features]
# 远程图片（http/https）加载能力。刻意不设 default：默认关闭，由 root 打开。
# 单一开关点放在二进制组合根，避免 infra 的多个消费者各自把 TLS 链拖回二进制。
remote-images = ["dep:ureq", "dep:rustls-native-certs"]

[dev-dependencies]
# 内联测试用临时目录（字体发现 / 图片落盘 / 编码探测）。
tempfile = { workspace = true }

# V11-65：lint 经 [workspace.lints] 单点继承。
[lints]
workspace = true
