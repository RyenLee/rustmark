[package]
# 独立 crate 版本号不随应用发版（publish = false，仅参与本地 workspace 构建）。
name = "rustmark-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "rustmark 的表现层非视图部分：egui 布局不变式封装（widgets）"
publish = false

[dependencies]
# --- UI 绘制原语（ADR-001：egui 原生）---
# widgets 全部是 egui 布局配方封装（行命中区 / 限宽文本 / 圆角底色），
# 不接触渲染后端（eframe / wgpu 属 root）。
# V11-65：版本/规格继承 root [workspace.dependencies]（单点真源）。
egui = { workspace = true }

# --- 本地 crate（core：主题色是被封装配方的输入）---
# `row::paint_row_background` 要读 `Theme` 的 accent_soft / bg_tertiary——
# widgets 是主题的消费者，依赖方向 ui → core 与阶段 2 规划一致
# （root → {ui, core, icons, actions}；ui → core → actions 与
# icons → actions 两条链在 actions 汇合，无环）。
# 依赖面由 tests/workspace_topology_test.rs 断言（= egui + rustmark-core + rustmark-render）。
rustmark-core = { path = "../rustmark-core" }

# --- 本地 crate（R-04 升 crate，2026-10-28）：富内容渲染引擎 ---
# 数学 / Mermaid 排版（egui-free 的几何层 + 唯一 egui 后端）。ui 经
# `presentation.rs` 的 `pub mod rich { pub use rustmark_render::*; }` 拼回
# `crate::presentation::rich` 原路径，消费方零改动。开启 `egui` feature 以
# 启用唯一 egui 后端（`render::apply_egui` / `render::rgb8_from_color32`）。
rustmark-render = { path = "../rustmark-render", features = ["egui"] }

# V11-65：lint 经 [workspace.lints] 单点继承。
[lints]
workspace = true
