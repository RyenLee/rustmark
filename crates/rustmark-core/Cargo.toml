[package]
name = "rustmark-core"
# 独立 crate 版本号不随应用发版（publish = false，仅参与本地 workspace 构建）。
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# 依赖切分原则（D-3 阶段 4a，V11-64 后重述）：core 只剩**纯六边形脊柱**——
# domain / application 与 presentation 的 doc-only 空壳。基础设施实现
# （syntect / ureq / rfd / image / ropey / pulldown-cmark）自 2026-10-26 起
# 住在 `rustmark-infra`，复用 domain/application 的消费者不必再被它们拖进
# 编译图；egui 自 V11-63 起也不在 core（端口化）。
# eframe / env_logger / anyhow 等「只被组合根与视图使用」的留在 root。

# --- 本地 crate（V11-57：UI 动作词汇表契约 crate）---
# UiAction / MenuGroup 是菜单 / 工具栏 / 命令面板 / 快捷键共用的词汇表，
# 抽成零依赖叶子：icons（V11-58 待拆）也只要这一份，不必反向依赖整个 core。
# 「不得反向引用 core」由 Cargo 循环依赖 + workspace 拓扑断言兜底
# （docs/workspace-topology.expected.txt）——零依赖是本 crate 的设计约束。
rustmark-actions = { path = "../rustmark-actions" }

# --- 本地 crate（TD-04：共享内核，2026-10-26 抽出）---
# 零 IO 的纯值 / 端口 / 唯一真源（error / ids / geometry / path / pattern /
# text_format / theme / lru …）。抽取动机是「共享内核有自己的准入与登记规则
# （§4.5）+ 可被非 UI 消费者单独复用」；反向依赖由 Cargo 锁死（shared 不依赖
# core）。core 以 `pub use rustmark_shared::shared;` 桥接，公开路径零变化。
rustmark-shared = { path = "../rustmark-shared" }

# --- 配置与序列化（DTO / 偏好值对象的 serde）---
serde = { version = "1", features = ["derive"] }

# --- 错误处理（领域/应用层错误用 thiserror；anyhow 只允许在组合根入口）---
thiserror = "2"

# --- 日志（应用层毒锁恢复等越界告警）---
# V11-65：版本继承 root [workspace.dependencies]。
log = { workspace = true }

# --- 缓存哈希器（跨文件搜索 span 缓存；no-rng 免 getrandom）---
ahash = { version = "0.8", default-features = false, features = ["std", "no-rng"] }

# V11-65：lint 经 [workspace.lints] 单点继承（原为 src/lib.rs 顶部的 attribute）。
[lints]
workspace = true
