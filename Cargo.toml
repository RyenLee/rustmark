# D-3 阶段 4a：workspace 化。core（四层 + presentation 非视图子模块）是独立
# crate，依赖方向被 cargo 锁死（core 无法反向依赖 root）；root 经 re-export 拼接
# 全部 `crate::` 路径，存量源码零改动。
# V11-57：rustmark-actions（UiAction 词汇表）是第二个成员——零依赖契约 crate，
# core 依赖它、root 不直接依赖（UiAction 经 core 的 registry re-export 访问）。
# V11-58：rustmark-icons（向量图标资源）是第三个成员——root **直接**依赖
# （presentation.rs 把 crate re-export 成 icons 模块），core 不依赖。
# V11-62 批次 1：rustmark-ui（表现层非视图部分，现仅 widgets）是第四个成员——
# root 直接依赖（presentation.rs 把 crate 的 widgets 模块 re-export 回原路径），
# ui 反向依赖 core（row 封装读 Theme 配色），root → ui → core 与
# root → core 两条边并存，无环。
# 命令面仍**显式带 `--workspace`**（clippy/check/test/llvm-cov）以自明意图；
# 漏带不再静默缺席——`default-members` 兜底（见下），不带 flag 也覆盖全部成员。
# 两处清单必须同步：新增成员只改 `members` 会让该 crate 重新对裸命令隐身，
# `tests/workspace_topology_test.rs::default_members_cover_every_workspace_member`
# 会当场报红（多 crate 评审 §4.1 / 债务 D-2 的机械化落地）。
[workspace]
members = [
    "crates/rustmark-actions",
    "crates/rustmark-assembly",
    "crates/rustmark-core",
    "crates/rustmark-icons",
    "crates/rustmark-infra",
    "crates/rustmark-ports",
    "crates/rustmark-render",
    "crates/rustmark-shared",
    "crates/rustmark-ui",
]
# `.` 是 root 包（隐式成员，不在 `members` 里）；写进来才是「裸 cargo 命令
# 也编 root」。顺序与 members 对齐无强制，但保持一致便于人工对账。
default-members = [
    ".",
    "crates/rustmark-actions",
    "crates/rustmark-assembly",
    "crates/rustmark-core",
    "crates/rustmark-icons",
    "crates/rustmark-infra",
    "crates/rustmark-ports",
    "crates/rustmark-render",
    "crates/rustmark-shared",
    "crates/rustmark-ui",
]
resolver = "3"

# V11-65：版本单点真源。root 与 core 两份 manifest 原先逐字重复声明同规格依赖
# （egui / image / syntect / log / tempfile），新增一条依赖要写两遍、改一处漏一处
# 即静默分叉——收敛到本表，成员侧 `{ workspace = true }` 继承。
# 各依赖的选型理由注释保留在使用处（版本进真源，理由留上下文）。
#
# V11-67（依赖统一收口）：本表的准入判据 = **同一依赖有 ≥2 个声明点**（分叉风险
# 才需要单点真源）。据此本轮再纳入 serde / thiserror / ahash（core / infra /
# ports / shared 各自逐字重复）与 wgpu（root 三个 per-OS 目标段各抄一遍版本号）。
# 两个例外（刻意不入本表，理由在此登记，避免下一轮反复讨论）：
# 1. **单一声明点的外部依赖**：pulldown-cmark / ropey / rfd / toml / ureq /
#    rustls-native-certs（仅 infra 使用）、eframe / anyhow / env_logger（仅 root
#    使用）。只有一个声明点时，那个声明点本身就是真源，迁入本表只多一层间接，
#    没有任何防漂移收益。
# 2. **crate 专属 feature**：egui 的 `optional = true`（render）、wgpu 的平台后端
#    feature（root 三个目标段）——规格差异是有意的，成员侧在 `workspace = true`
#    之上追加 feature，而不是把差异抹平。
[workspace.dependencies]
# --- UI 绘制原语（ADR-001：egui 原生）---
# core 只画 egui（TextFormat / LayoutJob / Galley 等），不接触渲染后端；
# eframe 属组合根，留在 root、不入本表（单一声明点）；wgpu 的**版本**在表内、
# 平台后端 feature 在 root 的三个目标段（见下文）。
egui = { version = "0.37.0", default-features = false }

# --- 图片解码（S6-05 预览区显示图片）---
# core（infrastructure 落盘与缩放）与 root（views 解码）同规格声明；
# 只启用白名单位图格式，不启 svg、关 default。
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }

# --- 解析与高亮（ADR-002）---
# syntect 只保留「解析 + 语法集」：不启 default-themes / yaml-load / plist-load，
# 保留 regex-fancy（纯 Rust，避开 onig）。core 的 parsing/highlighting 适配与
# root 集成测试（tests/infrastructure/highlighter_test.rs）直接引用语法集，
# 两处规格必须一致（feature 统一后行为同源）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "dump-load",
    "regex-fancy",
] }

# --- 日志（基础设施层越界告警用）---
log = "0.4"

# --- 测试临时目录（两侧 dev-dependencies 同规格）---
tempfile = "3"

# --- 配置与序列化（V11-67：core / infra / ports / shared 四处逐字重复）---
# 仅启用 `derive`：DTO / 偏好值对象 / 端口载荷全用派生，不用自定义 (De)Serializer。
serde = { version = "1", features = ["derive"] }

# --- 错误处理（V11-67：core / infra / ports / shared 四处重复）---
# 域 / 应用 / 端口错误枚举一律 thiserror；anyhow 只允许在组合根入口（CONSTR-10）。
thiserror = "2"

# --- 缓存哈希器（V11-67：core / ports / shared 三处重复）---
# 键全是内部 `DocumentId`(u64)，非攻击者可控，故关 `runtime-rng`（免 getrandom）、
# 关 default 只留 `std`；种子由 ASLR + 实例计数器派生（ahash 文档「最弱但可用」档）。
ahash = { version = "0.8", default-features = false, features = [
    "std",
    "no-rng",
] }

# --- wgpu 后端基座（V11-67：原先三个 per-OS 目标段各抄一遍 30.0.1）---
# 只钉版本与平台无关的 `std`；**后端 feature（dx12 / metal / vulkan+gles）留在
# root 的三个 `[target.*]` 段**——按平台各开一个（体积增量最小，理由见下）。
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }

# V11-65：lint 单点真源（原为 root 与 core 两个 lib.rs 各一份 attribute，
# 规范 §四-15 / DOC-03 要求「两处必须保持一致」——手动同步本身就是债）。
# 本地 `cargo clippy` 只告警；CI 的 `-D warnings` 升级为失败（V11-12 设计不变）。
# 测试代码豁免（unwrap 允许）是 cfg 形态，无法进本表，保留在各 lib.rs。
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.lints.rust]
missing_docs = "warn"

# V11-65/67 的「单点真源」原则延伸到包元数据：版本、edition、rust-version、
# license 与 publish 在此声明一次，root 与 9 个成员统一继承。早先 10 个 manifest
# 逐字重复，升级工具链或版本时要改 10 处，漏改一处即静默分叉。
# publish = false：仅参与本地 workspace 构建，不发布到 crates.io。
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[package]
name = "rustmark"
description = "原生轻量级 Markdown 编辑器（Rust 2024 + egui + wgpu）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 关闭测试目标自动发现：全部测试目标已在文件末尾显式 `[[test]]` 声明。
# 原因：无 `mod.rs` 布局下共享工具是 `tests/support.rs`（与 `tests/support/`
# 子模块配对），若保留自动发现，Cargo 会把它也编译成一个名为 `support`
# 的测试目标（零用例，且与 `#[path]` 引入的那份重复编译）。
autotests = false

# 项目有两个二进制目标（rustmark 编辑器 / check-arch 架构校验器），
# 不设 default-run 时 `cargo run` 会报「无法确定要运行哪个二进制」。
# 设为 rustmark 后，裸 `cargo run` 即等价于 `cargo run --bin rustmark`。
default-run = "rustmark"

# 需求文档 §7.1 未列出 lib.rs，但集成测试（tests/domain 等）必须能引用 crate 内模块，
# 故采用 lib + bin 双目标：src/lib.rs 声明全部模块，src/main.rs 仅作为薄入口调用 crate::app。
[lib]
name = "rustmark"
path = "src/lib.rs"

[[bin]]
name = "rustmark"
path = "src/main.rs"

[[bin]]
name = "check-arch"
path = "src/bin/check-arch.rs"

# V11-65：lint 经 [workspace.lints] 单点继承（原为 src/lib.rs 顶部的 attribute）。
[lints]
workspace = true

[dependencies]
# --- UI（ADR-001：egui 原生，wgpu 后端）---
# 注意：eframe 的 default 渲染后端是 glow(OpenGL)，需求 §5.1 要求 wgpu，
# 故关闭 default 并显式启用 wgpu + 必要的平台特性，避免同时编译两个渲染后端。
#
# 0.37 起 `wgpu` 这个 feature 会连带打开 `egui-wgpu/default` → `wgpu/default`
# （等于各平台后端全开，体积回到 DEF-03 之前的水平）。故改启用
# `wgpu_no_default_features`：只引入 `dep:wgpu` + `dep:egui-wgpu` 而不带默认特性，
# 后端仍由下方各平台的 `wgpu` 直接声明按平台各开一个（体积最小）。
#
# **不启用 `accesskit`**（cf. S8-02 依赖复查）：accesskit 只负责向辅助技术
# （屏幕阅读器）暴露语义树，本应用代码零引用，键盘导航 / IME / 焦点链路
# 全部走 egui 自身实现，与 accesskit 无关。禁用后可连带移除
# accesskit / accesskit_winit / accesskit_windows / accesskit_consumer 四个 crate，
# 以及仅被它们引用的重复版本 hashbrown 0.15 / foldhash 0.1。代价是放弃
# 屏幕阅读器可达性——对单人本地 Markdown 编辑器是已知且可接受的取舍。
# REL-03 体积缓解（docs/spec/metrics.md §2.4 方案①）：**两个字体 feature 都不启用**。
# `default_fonts` + `monochrome_emoji_fonts` 会把 epaint_default_fonts 的 5 个字体
# （Ubuntu-Light / Hack / NotoEmoji / emoji-icon-font / egui-icons，合计 1,417,504 B）
# 以 `include_bytes!` 编进 exe——这是 10 MB 未压缩红线（NFR-PERF-01）下
# 最大的一块可省体积，实测占越线缺口的 98.5%。
# 五个字体文件改为随发行包分发（assets/fonts → 打包后的 fonts/，
# 许可证见该目录 Fonts-LICENSE.txt：UFL / MIT / OFL / MIT），运行期由
# `infrastructure::fonts::font_definitions` 装配进 Proportional / Monospace
# 基础族——字节、字形、兜底顺序与内嵌时代逐项一致，界面观感不变。
# egui-icons.ttf（3.4 KB，仅支撑 `egui::special_emojis` 的少数图标）未随包：
# 本项目对 special_emojis 零引用（grep 全库可证），egui 自身绘制也不用它。
egui = { workspace = true }
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu_no_default_features",
    "x11",
    "wayland",
] }

# --- 本地 crate（D-3 阶段 4a：核心库）---
# domain / application 在 core（presentation 已于 V11-62 全部迁出，core 不再
# 保留 doc-only 空壳）；shared 在
# TD-04 抽出的 rustmark-shared（core 经 re-export 拼回 `crate::shared`）；
# infrastructure 在 V11-64 抽出的 rustmark-infra（root 经 re-export 拼回
# `crate::infrastructure`）；state / theme / shortcuts / widgets 在
# V11-62 抽出的 rustmark-ui（rich 已于 R-04 升 crate 为 rustmark-render）；icons 在 V11-58 抽出的 rustmark-icons；
# root 只留组合根 app 与 presentation::views。
# V11-57：rustmark-actions（UiAction 词汇表）是 workspace 成员，但 root **不
# 直接依赖**它——UiAction 经 core 的 registry re-export 访问（root→actions
# 直连会让「词汇表只服务 core 契约」的边界多出一条边）。
rustmark-core = { path = "crates/rustmark-core" }

# --- 本地 crate（M2，R-10 项 B 补全：组合根装配下沉，2026-10-29）---
# 原 root `src/app/bootstrap.rs` 的装配实现（production_bundle / Services /
# ConfigPaths / assemble_with_*）整体平移至此；root 仅留 re-export 门面
# （`pub use rustmark_assembly::bootstrap::*`）拼回 `rustmark::app::bootstrap::*`
# 原路径，tests/ 与 frame/ 零改动。assembly 依赖面恰为 core + infra + ports。
rustmark-assembly = { path = "crates/rustmark-assembly" }

# --- 本地 crate（V11-64：基础设施层，2026-10-26 抽出）---
# 外部库适配与 IO（syntect / ureq / rfd / image / ropey / pulldown-cmark）。
# 端口与领域类型在 core，实现在此（infra → core 单向）；core 不再依赖这些
# 重库，复用 domain/application 的消费者不必被拖进编译图。经
# `pub use rustmark_infra::infrastructure;` 拼回 `crate::infrastructure`
# 原路径，组合根装配与 tests/infrastructure 零改动。
rustmark-infra = { path = "crates/rustmark-infra" }

# --- 本地 crate（V11-58：向量图标资源）---
# 16×16 设计栅格规格数据 + Painter 渲染器；core 内零消费者，只被 root 视图
# （toolbar_view）与集成测试使用，故 root 直接依赖、core 不依赖。经
# src/presentation.rs 的 `pub use rustmark_icons as icons;` 拼回
# `crate::presentation::icons::*` 原路径（存量引用零改动）。
rustmark-icons = { path = "crates/rustmark-icons" }

# --- 本地 crate（V11-62 批次 1：表现层非视图部分）---
# widgets（egui 布局不变式封装，T8）；core 内零消费者，只被 root 视图
# （8 个 view 文件）与集成测试使用，故 root 直接依赖。ui 反向依赖 core
# （`row::paint_row_background` 读 `Theme` 的 accent_soft / bg_tertiary）。
# 经 src/presentation.rs 的 `pub use rustmark_ui::widgets;` 拼回
# `crate::presentation::widgets` 原路径（存量引用零改动）。
rustmark-ui = { path = "crates/rustmark-ui" }

# R-04（2026-10-28，`22e8a86`）：ui 内 `presentation::rich`（数学 / Mermaid 自绘）
# 已**升 crate**为 `rustmark-render`；ui 经 `pub mod rich { pub use rustmark_render::*; }`
# 拼回原路径（消费方零改动）。render 默认 egui-free（`feature="egui"` 双门控唯一
# 后端 `render/egui.rs`），对 core 零依赖；root 不直接依赖 render（仅 ui 依赖）。

# --- 解析与高亮（ADR-002）---
# pulldown-cmark / syntect 已下沉 core（infrastructure::parsing / highlighting）；
# syntect 另见文末 dev-dependencies（集成测试直接引用语法集）。


# --- 图片解码（S6-05 预览区显示图片）---
# `image` 已由 eframe（经 arboard）引入依赖图，直接依赖不额外增大产物体积。
# 只启用资源加载器白名单里的位图格式；**不启 svg**（SVG 可携带 <script>，
# 见 asset_loader.rs 的安全说明），且关闭 default 以避开无关编码器。
image = { workspace = true }

# --- 错误处理 ---
# thiserror 已下沉 core（domain/application 的错误类型）；
# anyhow 只允许出现在组合根入口（app.rs / main.rs），留 root。
anyhow = "1"

# --- 远程图片下载 ---
# ureq / rustls-native-certs 已下沉 core（infrastructure::persistence::asset_loader）。

# --- 日志（基础设施层越界告警用；未列入需求 §5.1，已在 docs/guides/dependencies.md 登记）---
log = { workspace = true }
# 日志后端（F-2：此前 log 的 12 个告警调用点无后端接收，全部静默丢弃）。
# 只开 `humantime`：默认特性的 `regex` 会链入整个 `regex` crate
# （依赖树里此前只有 fancy-regex → regex-automata，没有 regex；体积红线
# 10.93→13.46 MiB 正告急），而模块级过滤（RUST_LOG=rustmark::app=debug）
# 不依赖正则即可工作。`termcolor` 同样不启：输出走 stderr，着色交给终端。
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

# --- 缓存哈希器 ---
# ahash 已下沉 core（span / galley / 高亮缓存都在 core 侧）。

# --- wgpu 后端（DEF-03：必须显式声明，否则应用启动即 panic）---
#
# 背景：需求 §5.1 要求 wgpu 后端，故对 eframe 关闭了 default（避免同时编译 glow
# 与 wgpu 两个后端）。但 wgpu 的**后端 feature**（dx12 / metal / vulkan / gles）
# 只存在于 `wgpu/default`，而启用它的路径是：
#     eframe/default → egui-wgpu/default → wgpu/default
# eframe 声明 egui-wgpu 时也用了 `default-features = false`，于是这条链整体断开：
# wgpu 只剩 `std` + `wgsl`（wgpu-core 编译进来了，但零后端），
# `wgpu::Instance::new` 直接 panic：
#     "No wgpu backend feature that is implemented for the target platform was enabled."
#
# 结论：**关掉 eframe 的 default 后必须自己补 wgpu 后端 feature**。
# 这里按平台各启**一个**后端（体积增量最小，见 docs/spec/metrics.md §2.3），
# 而不是开 `wgpu/default`（那会在每个平台都编译用不到的后端）。
#
# `wgpu` 是本已在依赖树内的 crate（经 eframe 引入），此处只是补一份直接声明
# 以便打开 feature；应用代码不直接调用它，唯一引用是 tests/startup_smoke.rs 的守卫断言。
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

# exe 内嵌图标（写进 PE 资源段）。与运行期 `ViewportBuilder::with_icon` 是两条
# 独立链路：缺资源段时，资源管理器里与「固定到任务栏」的静态图标仍是空白。
# 只有 `build.rs` 一个声明点，按准入判据留在原地，不进 `[workspace.dependencies]`。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = { workspace = true }
# 集成测试直接引用语法集（tests/infrastructure/highlighter_test.rs），
# 规格与 core 侧完全一致以保证 feature 统一后行为同源。
syntect = { workspace = true }

# 需求文档 §8.1 体积优化配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 阶段 05 出口验收目标（golden 语料 + 性能基线）。
[[test]]
name = "integration"
path = "tests/integration/main.rs"

# 组合根与调度（S6-01）：唯一能同时看见四层的地方，必须有独立测试目标。
[[test]]
name = "app"
path = "tests/app/main.rs"

# ————————————————————————————————————————————————————————————
# S9-01 · 测试金字塔的显式目标声明
#
# 测试按层分目录，每层一个 `main.rs` 入口（harness）。目录即分层：
# `tests/domain/` 纯领域单测、`tests/application/` fake 依赖用例、
# `tests/infrastructure/` 适配器与 golden、`tests/integration/` 跨层 +
# 真实 tempdir、`tests/e2e/` 可自动化端到端；另有 `tests/shared/`
# （shared 层单测）、`tests/presentation/`（表现层，egui CPU 布局）。
# 虽然 Cargo 的自动发现也能找到它们，但**显式声明**让「删掉一个入口
# 文件 = 从构建里移除该层」成为有意识的决定，而不是静默的文件系统巧合。
# ————————————————————————————————————————————————————————————

[[test]]
name = "domain"
path = "tests/domain/main.rs"

[[test]]
name = "application"
path = "tests/application/main.rs"

[[test]]
name = "infrastructure"
path = "tests/infrastructure/main.rs"

[[test]]
name = "presentation"
path = "tests/presentation/main.rs"

[[test]]
name = "shared"
path = "tests/shared/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# 启动冒烟（DEF-03 教训：守「能编译、能过测试、但启动即崩」的配置型缺陷）。
[[test]]
name = "startup_smoke"
path = "tests/startup_smoke.rs"

# 架构校验器自身的验证（S2-07）：零违规 + 注入违规必被检出。
[[test]]
name = "arch_violation_fixture"
path = "tests/arch_violation_fixture.rs"

# core 字段级可见性白名单（D-3 阶段 4b-5，R-02 续）：pub 字段面钉死，
# 新增 / 放宽必须先登记（集合相等双向断言）。
[[test]]
name = "field_visibility_guard"
path = "tests/field_visibility_guard_test.rs"

# workspace 结构守卫（V11-57）：契约 crate 的依赖面断言（零依赖 / 期望依赖集），
# 与 CI 的拓扑 diff（docs/spec/workspace-topology.expected.txt）互为本地门禁与远端兜底。
[[test]]
name = "workspace_topology"
path = "tests/workspace_topology_test.rs"

# 测试归属口径（D-6）：`autotests = false` 下未写 `[[test]]` 的测试入口
# **不会被编译**，全量测试照样全绿——本守卫把这种「静默缺席」变成红的。
[[test]]
name = "test_target_guard"
path = "tests/test_target_guard_test.rs"
